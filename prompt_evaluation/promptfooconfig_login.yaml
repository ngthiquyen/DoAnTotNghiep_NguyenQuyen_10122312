description: "Evaluate prompt quality for Login feature"

prompts:
  - file://prompts/prompt_v1.txt
  - file://prompts/prompt_v2.txt
  - file://prompts/prompt_v3.txt

providers:
  - id: ollama:llama3
    config:
      temperature: 0.1
      num_predict: 700

defaultTest:
  assert:
    - type: contains
      value: "BUSINESS KEYWORDS"
      metric: has_business_keywords

    - type: contains
      value: "UI ACTION KEYWORDS"
      metric: has_ui_action_keywords

    - type: contains
      value: "VERIFICATION KEYWORDS"
      metric: has_verification_keywords

    - type: contains
      value: "Keyword Name"
      metric: has_keyword_name_column

    - type: not-contains
      value: "*** Test Cases ***"
      metric: no_robot_test_cases

    - type: not-contains
      value: "Test Cases"
      metric: no_test_cases_text

    - type: not-contains
      value: "XPath"
      metric: no_xpath

    - type: not-contains
      value: "xpath="
      metric: no_xpath_lower

    - type: not-contains
      value: "css="
      metric: no_css_selector

    - type: not-contains
      value: "def "
      metric: no_python_code

    - type: not-contains
      value: "import "
      metric: no_import_code

    - type: not-contains
      value: "example"
      metric: no_example_values
    
    - type: contains
      value: "Input Parameters"
      metric: has_input_parameters_column

    - type: contains
      value: "Required Parameters"
      metric: has_required_parameters_column

    - type: contains
      value: "Optional Parameters"
      metric: has_optional_parameters_column

    - type: contains
      value: "Derived From SeleniumLibrary Keyword"
      metric: has_selenium_mapping_column

tests:
  - vars:
      FEATURE: |
        Chức năng: Đăng nhập

        Mô tả:
        Chức năng đăng nhập cho phép người dùng truy cập vào hệ thống bằng cách xác thực thông tin đăng nhập đã được lưu trữ trong cơ sở dữ liệu.

        Luồng chính:
        1. Người dùng truy cập trang đăng nhập.
        2. Hệ thống hiển thị form đăng nhập.
        3. Người dùng nhập tên đăng nhập hoặc email.
        4. Người dùng nhập mật khẩu.
        5. Người dùng nhấn nút Đăng nhập.
        6. Hệ thống kiểm tra thông tin đăng nhập.
        7. Hệ thống xác thực thành công.
        8. Hệ thống đăng nhập người dùng và chuyển hướng đến trang chủ.

        Luồng ngoại lệ:
        1. Dữ liệu đăng nhập bị bỏ trống.
        2. Tài khoản không tồn tại.
        3. Mật khẩu không đúng.
        4. Tài khoản bị khóa hoặc chưa kích hoạt.

        Kết quả mong đợi:
        - Người dùng đăng nhập thành công khi nhập đúng thông tin.
        - Hiển thị thông báo lỗi phù hợp khi đăng nhập thất bại.