description: "Evaluate prompt quality for order feature"

prompts:
  - file://prompts/prompt_v1.txt
  - file://prompts/prompt_v2.txt
  - file://prompts/prompt_v3.txt

providers:
  - id: ollama:llama3
    config:
      temperature: 0.1
      num_predict: 700

defaultTest:
  assert:
    - type: contains
      value: "BUSINESS KEYWORDS"
      metric: has_business_keywords

    - type: contains
      value: "UI ACTION KEYWORDS"
      metric: has_ui_action_keywords

    - type: contains
      value: "VERIFICATION KEYWORDS"
      metric: has_verification_keywords

    - type: contains
      value: "Keyword Name"
      metric: has_keyword_name_column

    - type: not-contains
      value: "*** Test Cases ***"
      metric: no_robot_test_cases

    - type: not-contains
      value: "Test Cases"
      metric: no_test_cases_text

    - type: not-contains
      value: "XPath"
      metric: no_xpath

    - type: not-contains
      value: "xpath="
      metric: no_xpath_lower

    - type: not-contains
      value: "css="
      metric: no_css_selector

    - type: not-contains
      value: "def "
      metric: no_python_code

    - type: not-contains
      value: "import "
      metric: no_import_code

    - type: not-contains
      value: "example"
      metric: no_example_values

    - type: contains
      value: "Input Parameters"
      metric: has_input_parameters_column

    - type: contains
      value: "Required Parameters"
      metric: has_required_parameters_column

    - type: contains
      value: "Optional Parameters"
      metric: has_optional_parameters_column

    - type: contains
      value: "Derived From SeleniumLibrary Keyword"
      metric: has_selenium_mapping_column

tests:
    - vars:
          FEATURE: | 
                Chức năng: Đặt hàng

                Mô tả:
                Chức năng đặt hàng cho phép người dùng tạo đơn hàng bằng cách lựa chọn sản phẩm,
                thêm vào giỏ hàng và thực hiện thanh toán với thông tin giao hàng hợp lệ.

                Luồng chính (Main Flows):
                1. Người dùng chọn sản phẩm từ trang chủ.
                2. Hệ thống hiển thị thông tin chi tiết của sản phẩm.
                3. Người dùng nhấn nút thêm.
                4. Người dùng mở trang giỏ hàng.
                5. Hệ thống hiển thị danh sách sản phẩm trong giỏ hàng.
                6. Người dùng nhập thông tin giao hàng.
                7. Người dùng nhấn đặt hàng.
                8. Hệ thống kiểm tra:
                    - Tính hợp lệ của thông tin giao hàng
                    - Tình trạng tồn kho của sản phẩm
                9. Hệ thống tạo đơn hàng thành công.
                10. Hệ thống hiển thị thông báo đặt hàng thành công.


                Luồng ngoại lệ (Alternate Flows):
                1. A2 – Giỏ hàng trống
                    Tại bước 5, nếu giỏ hàng không có sản phẩm
                    → Hệ thống hiển thị thông báo: “Giỏ hàng trống”

                2. A3 – Thông tin giao hàng không hợp lệ
                    Tại bước 8, nếu thông tin giao hàng thiếu hoặc sai định dạng
                    → Hệ thống hiển thị thông báo lỗi yêu cầu nhập lại

                Kết quả mong đợi (Expected):
                - Đơn hàng được tạo thành công.
                - Hiển thị thông báo lỗi phù hợp nếu đặt hàng thất bại.