description: "Evaluate prompt quality for search feature"

prompts:
  - file://prompts/prompt_v1.txt
  - file://prompts/prompt_v2.txt
  - file://prompts/prompt_v3.txt

providers:
  - id: ollama:llama3
    config:
      temperature: 0.1
      num_predict: 700

defaultTest:
  assert:
    - type: contains
      value: "BUSINESS KEYWORDS"
      metric: has_business_keywords

    - type: contains
      value: "UI ACTION KEYWORDS"
      metric: has_ui_action_keywords

    - type: contains
      value: "VERIFICATION KEYWORDS"
      metric: has_verification_keywords

    - type: contains
      value: "Keyword Name"
      metric: has_keyword_name_column

    - type: not-contains
      value: "*** Test Cases ***"
      metric: no_robot_test_cases

    - type: not-contains
      value: "Test Cases"
      metric: no_test_cases_text

    - type: not-contains
      value: "XPath"
      metric: no_xpath

    - type: not-contains
      value: "xpath="
      metric: no_xpath_lower

    - type: not-contains
      value: "css="
      metric: no_css_selector

    - type: not-contains
      value: "def "
      metric: no_python_code

    - type: not-contains
      value: "import "
      metric: no_import_code

    - type: not-contains
      value: "example"
      metric: no_example_values

    - type: contains
      value: "Input Parameters"
      metric: has_input_parameters_column

    - type: contains
      value: "Required Parameters"
      metric: has_required_parameters_column

    - type: contains
      value: "Optional Parameters"
      metric: has_optional_parameters_column

    - type: contains
      value: "Derived From SeleniumLibrary Keyword"
      metric: has_selenium_mapping_column

tests:
    - vars:
          FEATURE: | 
                Chức năng: Tìm kiếm sản phẩm

                Mô tả:
                Chức năng tìm kiếm cho phép người dùng tìm sản phẩm trong hệ thống dựa trên từ khóa.

                Luồng chính (Main Flows):
                1. Người dùng nhập từ khóa vào ô tìm kiếm.
                2. Người dùng nhấn nút tìm kiếm.
                3. Hệ thống xử lý từ khóa.
                4. Hệ thống thực hiện tìm kiếm các sản phẩm có thông tin phù hợp với từ khóa.
                5. Hệ thống hiển thị danh sách sản phẩm thỏa mãn với từ khóa tìm kiếm.

                Luồng ngoại lệ (Alternate Flows):
                1.  A1. Người dùng không nhập từ khóa
                    - Hệ thống không thực hiện tìm kiếm.
                    - Hệ thống hiển thị thông báo yêu cầu người dùng nhập từ khóa tìm kiếm.

                2.  A2. Không tồn tại sản phẩm phù hợp
                    - Hệ thống thực hiện tìm kiếm với từ khóa đã nhập.
                    - Không có sản phẩm nào thỏa mãn điều kiện.
                    - Hệ thống hiển thị thông báo không tìm thấy kết quả phù hợp.

                Kết quả mong đợi (Expected):
                - Khi từ khóa hợp lệ và tồn tại sản phẩm phù hợp: Danh sách sản phẩm tương ứng được hiển thị chính xác.

                - Khi không có kết quả hoặc dữ liệu không hợp lệ: Thông báo phù hợp được hiển thị cho người dùng.